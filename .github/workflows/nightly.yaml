name: Nightly corpus audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The last step opens or updates one issue when the run fails.
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main


      # The audit needs only the corpus, not the simulators the verify shell builds.
      # The baseline was taken from ngspice and HSPICE sources; .sim decks are read as VACASK.
      - name: Corpus audit
        run: |
          export SPRACK_SUITE=$(nix eval --raw .#devShells.x86_64-linux.verify.SPRACK_SUITE)
          nix develop .#ci --command sh -c '
            zig build -Doptimize=ReleaseSafe &&
            python3 -I tools/corpus_audit.py zig-out/bin/sprack "$SPRACK_SUITE/tests" out.tsv ngspice,hspice &&
            python3 -I tools/corpus_summary.py out.tsv &&
            python3 -I tools/corpus_compare.py tools/corpus-baseline.tsv out.tsv'

      # Translates each deck to VACASK and runs upstream vacask on it. The
      # verify shell builds VACASK and its OSDI models from source.
      - name: VACASK load check
        if: always()
        run: nix develop .#verify --command tools/vacask-loadcheck/check.sh

      # Ten minutes of coverage-guided fuzzing over the four targets (netlist
      # text, JSON, grammar files, include trees), and the 20,000 damaged
      # netlists from this run's seed, printed when they fail (issue 64).
      # Running out the time is a pass; a failure saves its input. Zig
      # 0.18-dev exits 0 when a fuzz test fails (it counts failures before
      # it fuzzes), so the saved input is the verdict.
      - name: Fuzz
        if: always()
        run: |
          export SPRACK_FUZZ_SEED=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "seed $SPRACK_FUZZ_SEED"
          nix develop .#ci --command sh -c '
            zig build test || exit 1
            rm -f .zig-cache/f/crash
            start=$(date +%s)
            timeout 600 zig build test --fuzz=100M; rc=$?
            echo "fuzzed $(( $(date +%s) - start )) s, status $rc"
            [ ! -e .zig-cache/f/crash ] || { echo "a fuzz test failed: input in .zig-cache/f/crash"; exit 1; }
            [ $rc -eq 0 ] || [ $rc -eq 124 ]'

      # Every catalogue device of sky130, IHP and GF180 in ngspice against its
      # Xyce and VACASK translation (issue 61); a changed verdict fails.
      - name: PDK devices
        if: always()
        run: |
          export SPRACK_TEST_PDKS=$(nix build .#test-pdks --no-link --print-out-paths)
          nix develop .#verify --command sh -c '
            zig build py &&
            python3 -I tools/pdk_devices.py --out pdk-devices.tsv --baseline tools/pdk-devices-baseline.tsv'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-audit
          path: |
            out.tsv*
            pdk-devices.tsv
            .zig-cache/f/crash

      # A failed night is said where people look (issue 67): one open issue,
      # titled so, a comment per failed run.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly run failed"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The nightly run failed: $RUN. Each later failure adds a comment here; close this when the nights pass again."
          fi
