name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main

      - name: Zig tests
        run: nix develop .#ci --command zig build test

      # The PDKs and ngspice alone; the verify shell would also build the
      # other simulators.
      - name: Python tests
        run: |
          export SPRACK_TEST_PDKS=$(nix build .#test-pdks --no-link --print-out-paths)
          export SPRACK_TEST_PDKS_INSTALLED=$(nix build .#test-pdks-installed --no-link --print-out-paths)
          export PATH="$(nix build --inputs-from . nixpkgs#ngspice --no-link --print-out-paths)/bin:$PATH"
          nix develop .#ci --command sh -c 'zig build py && cd python && python3 test_sprack.py'

  wheel:
    # Zig from setup-zig, not nix, so macOS needs no Nix install.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.18.0-dev.349+d924f83bf

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: python -m pip wheel . -w dist --no-deps

      # The tag must match what the binary needs: glibc 2.28 on Linux, and on
      # macOS the minos Zig wrote into LC_BUILD_VERSION.
      - name: Check the platform tag
        run: |
          ls dist
          if [ "$RUNNER_OS" = Linux ]; then
            ls dist/*-manylinux_2_28_x86_64.whl
            python -m pip install auditwheel
            python -m auditwheel show dist/*.whl | tr '\n' ' ' | grep -q '"manylinux_2_28_x86_64"'
          else
            ls dist/*-macosx_11_0_arm64.whl
            unzip -p dist/*.whl sprack/_core.abi3.so > "$RUNNER_TEMP/core.so"
            otool -l "$RUNNER_TEMP/core.so" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 11.0'
          fi

      # Run the tests from outside the checkout so `import sprack` finds the
      # installed wheel, not python/sprack/.
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cp python/test_sprack.py "$RUNNER_TEMP/"
          export SPRACK_GRAMMARS="$PWD/grammars"
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'import sprack; print(sprack.__file__)'
          venv/bin/python test_sprack.py
