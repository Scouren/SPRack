name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main


      - name: Zig tests
        run: nix develop .#ci --command zig build test

      # What a project that pins SPRack builds: the package from a clean
      # checkout, with only the files the flake's source filter keeps.
      - name: Nix package
        run: nix build .#python --no-link

      # The PDKs and ngspice alone; the verify shell would also build the
      # other simulators.
      - name: Python tests
        run: |
          export SPRACK_TEST_PDKS=$(nix build .#test-pdks --no-link --print-out-paths)
          export SPRACK_TEST_PDKS_INSTALLED=$(nix build .#test-pdks-installed --no-link --print-out-paths)
          export PATH="$(nix build --inputs-from . nixpkgs#ngspice --no-link --print-out-paths)/bin:$PATH"
          nix develop .#ci --command sh -c 'zig build py && cd python && python3 test_sprack.py'

      # The format, and the pages' examples: a page whose printed output no
      # longer matches fails here, not after it is published.
      - name: Format and documentation examples
        run: |
          export SPRACK_TEST_PDKS=$(nix build .#test-pdks --no-link --print-out-paths)
          nix develop .#ci --command sh -c '
            zig fmt --check build.zig src &&
            zig build && zig build py &&
            python3 docs/check/checkfiles.py &&
            python3 docs/check/checkpage.py &&
            python3 docs/check/checkconsole.py'

  # Line coverage of src/ (kcov) and of the Python package (a settrace
  # tracer), each file held to one point below its recorded floor (issue 65).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main


      - name: Coverage
        run: |
          export SPRACK_TEST_PDKS=$(nix build .#test-pdks --no-link --print-out-paths)
          export PATH="$(nix build --inputs-from . nixpkgs#ngspice --no-link --print-out-paths)/bin:$PATH"
          nix develop .#ci --command sh -c '
            zig build coverage &&
            python3 -I tools/coverage_floor.py zig zig-out/coverage tools/coverage-floor-zig.tsv &&
            zig build py &&
            python3 tools/py_coverage.py py-coverage.tsv &&
            python3 -I tools/coverage_floor.py py py-coverage.tsv tools/coverage-floor-py.tsv'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            zig-out/coverage
            py-coverage.tsv

  # The corpus audit against the committed baseline, as the nightly job runs
  # it: a raised error count or a silent run fails the pull request.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main


      - name: Corpus audit
        run: |
          export SPRACK_SUITE=$(nix eval --raw .#devShells.x86_64-linux.verify.SPRACK_SUITE)
          nix develop .#ci --command sh -c '
            zig build -Doptimize=ReleaseSafe &&
            python3 -I tools/corpus_audit.py zig-out/bin/sprack "$SPRACK_SUITE/tests" out.tsv ngspice,hspice &&
            python3 -I tools/corpus_summary.py out.tsv &&
            python3 -I tools/corpus_compare.py tools/corpus-baseline.tsv out.tsv'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: corpus-audit
          path: out.tsv*

  wheel:
    # Zig from setup-zig, not nix, so macOS and Windows need no Nix install.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.18.0-dev.349+d924f83bf

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: python -m pip wheel . -w dist --no-deps

      # The tag must match what the binary needs: glibc 2.28 on Linux, and on
      # macOS the minos Zig wrote into LC_BUILD_VERSION. A Windows tag names
      # no version: the wheel must hold the .pyd and no other extension.
      - name: Check the platform tag
        shell: bash
        run: |
          ls dist
          if [ "$RUNNER_OS" = Linux ]; then
            ls dist/*-manylinux_2_28_x86_64.whl
            python -m pip install auditwheel
            python -m auditwheel show dist/*.whl | tr '\n' ' ' | grep -q '"manylinux_2_28_x86_64"'
          elif [ "$RUNNER_OS" = macOS ]; then
            ls dist/*-macosx_11_0_arm64.whl
            unzip -p dist/*.whl sprack/_core.abi3.so > "$RUNNER_TEMP/core.so"
            otool -l "$RUNNER_TEMP/core.so" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 11.0'
          else
            ls dist/*-win_amd64.whl
            python -m zipfile -l dist/*.whl
            [ "$(python -m zipfile -l dist/*.whl | grep -o '_core\.[a-z0-9.]*')" = _core.pyd ]
          fi

      # Run the tests from outside the checkout so `import sprack` finds the
      # installed wheel, not python/sprack/. A venv on Windows keeps its
      # interpreter in Scripts/.
      - name: Test the installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python"
          "$py" -m pip install dist/*.whl
          cp python/test_sprack.py "$RUNNER_TEMP/"
          export SPRACK_GRAMMARS="$GITHUB_WORKSPACE/grammars"
          cd "$RUNNER_TEMP"
          "$py" -c 'import sprack; print(sprack.__file__)'
          "$py" test_sprack.py
